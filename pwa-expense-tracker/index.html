<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="剪贴板记账" />
  <title>剪贴板记账</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>剪贴板记账</h1>
    <p class="muted">复制支付文本 → 点粘贴 → 3 秒记账</p>
  </header>

  <div id="clipboard-banner" class="clipboard-banner" hidden>
    <div class="banner-text">切回应用了，剪贴板可能有支付信息</div>
    <div class="banner-actions">
      <button type="button" id="banner-dismiss" class="btn-banner">忽略</button>
      <button type="button" id="banner-paste" class="btn-banner primary">粘贴记账</button>
    </div>
  </div>

  <!-- 账单 -->
  <main class="tab-panel" data-tab="home">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">今日</div>
        <div class="value" id="stat-today">¥0.00</div>
        <div class="muted" id="stat-today-count">0 笔</div>
      </div>
      <div class="stat-card">
        <div class="label">本周</div>
        <div class="value" id="stat-week">¥0.00</div>
        <div class="muted" id="stat-week-count">0 笔</div>
      </div>
      <div class="stat-card">
        <div class="label">本月</div>
        <div class="value" id="stat-month">¥0.00</div>
        <div class="muted" id="stat-month-count">0 笔</div>
      </div>
    </div>
    <div id="record-list"></div>
  </main>

  <!-- 记账 -->
  <section class="tab-panel" data-tab="entry" hidden>
    <div class="panel-section">
      <h2>粘贴支付文本</h2>
      <p class="muted">支付宝/微信/银行短信等，支持自动解析金额与商家</p>
      <textarea id="entry-text" placeholder="在此粘贴支付成功页文本…"></textarea>
      <button type="button" id="btn-parse-entry" class="btn btn-primary">解析并记账</button>
      <button type="button" id="btn-manual-entry" class="btn btn-secondary">手动填写</button>
    </div>
  </section>

  <!-- 分类 -->
  <section class="tab-panel" data-tab="categories" hidden>
    <div class="panel-section">
      <h2>分类管理</h2>
      <div id="category-list"></div>
      <div class="add-category">
        <input type="text" id="new-category" placeholder="新分类名称" />
        <button type="button" id="btn-add-category" class="btn btn-primary">添加</button>
      </div>
    </div>
  </section>

  <div id="paste-bar">
    <button type="button" id="btn-paste" class="btn btn-primary">粘贴记账</button>
  </div>

  <!-- iOS 手动粘贴弹层（避免剪贴板 API 被拒） -->
  <div id="paste-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="paste-title">
    <div class="confirm-sheet">
      <h2 id="paste-title">粘贴支付文本</h2>
      <p class="muted paste-hint">先复制支付通知，再<strong>长按</strong>下方输入框 → 点「粘贴」</p>
      <textarea id="paste-textarea" class="paste-textarea" placeholder="在此粘贴…"></textarea>
      <div class="confirm-actions">
        <button type="button" id="paste-cancel" class="btn btn-secondary">取消</button>
        <button type="button" id="paste-parse" class="btn btn-primary">解析记账</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="主导航">
    <button type="button" class="nav-btn active" data-tab="home">账单</button>
    <button type="button" class="nav-btn" data-tab="entry">记账</button>
    <button type="button" class="nav-btn" data-tab="categories">分类</button>
  </nav>

  <!-- 确认弹窗 -->
  <div id="confirm-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-sheet">
      <h2 id="confirm-title">确认记账</h2>
      <div id="confirm-warn" class="warn-box" hidden>解析置信度较低，请核对金额和商家</div>
      <div class="form-field">
        <label for="confirm-amount">金额</label>
        <input type="number" id="confirm-amount" step="0.01" min="0" inputmode="decimal" />
      </div>
      <div class="form-field">
        <label for="confirm-merchant">商家</label>
        <input type="text" id="confirm-merchant" />
      </div>
      <div class="form-field">
        <label for="confirm-category">分类</label>
        <select id="confirm-category"></select>
      </div>
      <div class="form-field">
        <label for="confirm-time">时间</label>
        <input type="datetime-local" id="confirm-time" />
      </div>
      <div class="form-field">
        <label for="confirm-note">备注</label>
        <input type="text" id="confirm-note" />
      </div>
      <div class="form-field">
        <label>来源 <span id="confirm-source" class="muted"></span></label>
        <div id="confirm-raw" class="raw-preview"></div>
      </div>
      <div class="confirm-actions">
        <button type="button" id="confirm-cancel" class="btn btn-secondary">取消</button>
        <button type="button" id="confirm-save" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
